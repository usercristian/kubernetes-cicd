name: 🐳 Docker Build and Push

on:
  push:
    branches: [ main ]
    # paths: [ 'app/**', 'Dockerfile' ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:5000
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  ECR_REPOSITORY: fiap-todo-apijobs

jobs:
  build-and-push:
    name: Validação, Build e Push to ECR
    runs-on: self-hosted
    
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      
      - name: Pre-flight Check - Validar Credenciais e Cofre (STS + ECR)
        run: |
          echo "[COFRE] Credenciais recuperadas com sucesso do GitHub Secrets."
          echo "[VALIDACAO] Executando teste de identidade (STS)..."
          aws sts get-caller-identity
          echo "[VALIDACAO] Executando teste de leitura do ECR..."
          aws ecr describe-repositories
          echo "[SUCESSO] Pre-flight Check aprovado no Moto Server."

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Amazon ECR Emulated
        id: login-ecr
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin http://localhost:5000
          echo "registry=localhost:5000" >> $GITHUB_OUTPUT
      
      - name: Generate image tags
        id: meta
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:v1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 🐳 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 🔍 Scan image
        continue-on-error: true
        run: |
          aws ecr start-image-scan \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-id imageTag=latest \
            --region ${{ env.AWS_REGION }} || echo " Image scan not supported for this image type"
      
      - name: Summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository**: ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`v1.${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY

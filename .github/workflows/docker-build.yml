name: Docker Build and Push

on:
  push:
    branches: [ main ]
    # paths: [ 'app/**', 'Dockerfile' ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:5000
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  ECR_REPOSITORY: fiap-todo-api
  ECR_URI: ${{ secrets.ECR_URI }}

jobs:
  build-and-push:
    name: Validacao, Build e Load no Minikube
    runs-on: self-hosted
    
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      
      - name: Pre-flight Check - Validar Credenciais de Forma Silenciosa
        run: |
          echo "[COFRE] Credenciais carregadas na memoria do runner."
          
          if aws sts get-caller-identity > /dev/null 2>&1; then
            echo "[SUCESSO] Identidade STS validada sem expor metadados."
          else
            echo "[ERRO] Falha na autenticacao STS no Moto Server."
            exit 1
          fi

      - name: Build da imagem OCI nativa via Podman
        run: |
          podman build \
            --tls-verify=false \
            --tag ${{ env.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest \
            --tag ${{ env.ECR_URI }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            --file ./Dockerfile .

      - name: Exportar imagem para arquivo fisico
        run: |
          echo "Exportando imagem do Podman para arquivo tar..."
          podman save -o image.tar ${{ env.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest ${{ env.ECR_URI }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          echo "[SUCESSO] Arquivo image.tar gerado."

      - name: Load da imagem para o cache do Minikube
        run: |
          echo "Injetando a imagem a partir do arquivo fisico no Minikube..."
          minikube image load image.tar
          echo "[SUCESSO] Imagens carregadas no cluster local."
          
      - name: Limpar artefato temporario
        run: |
          rm -f image.tar
      
      - name: Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Repository: ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY